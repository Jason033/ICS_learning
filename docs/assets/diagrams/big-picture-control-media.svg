<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1000" role="img" aria-labelledby="title desc"><title id="title">控制和媒體需要分別驗收</title><desc id="desc">Controller以Send呼叫adapter，adapter以Completed事件反向通知controller，狀態依完整身份更新。媒體另檢查附著session、Ready和樣本。控制完成不保證媒體或實體效果。全部是單程序Lab。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#28609b"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#287344"/></marker></defs>
<rect width="430" height="1000" rx="18" fill="#f4f7fb"/>
<g font-family="sans-serif" fill="#16304f" text-anchor="middle"><text x="215" y="40" font-size="25" font-weight="bold">控制與媒體：各自查證</text><text x="215" y="78" font-size="20">本文同一 Lab 處理程序</text>
<g fill="#dceafb" stroke="#28609b"><rect x="20" y="106" width="390" height="83" rx="12"/><rect x="20" y="273" width="390" height="83" rx="12"/></g>
<text x="215" y="139" font-size="23">Controller c：目標 B、session1</text><text x="215" y="173" font-size="20">先建立 R1 Pending；同身份才套用</text><text x="215" y="307" font-size="23">Adapter a：Send / Emit</text><text x="215" y="341" font-size="20">true 只代表本模型接受請求</text>
<path d="M75 189v81" stroke="#28609b" stroke-width="3" marker-end="url(#blue)"/><path d="M355 273v-81" stroke="#287344" stroke-width="3" marker-end="url(#green)"/>
<text x="134" y="221" font-size="19">Send 呼叫 ↓</text><text x="293" y="248" font-size="19">↑ Completed 事件</text>
<text x="215" y="392" font-size="21">控制 Completed 只證明其契約</text><text x="215" y="425" font-size="19">不代表後面的媒體 / 實體已正常</text>
<g fill="#eee5f8" stroke="#77539b"><rect x="20" y="467" width="390" height="90" rx="12"/><rect x="20" y="601" width="390" height="114" rx="12"/><rect x="20" y="759" width="390" height="83" rx="12"/></g>
<text x="215" y="501" font-size="23">Media：樣本 [600, −600]</text><text x="215" y="535" font-size="20">短整數代表值；不是真人語音</text>
<path d="M215 558v37M215 716v37" stroke="#77539b" stroke-width="3"/>
<text x="215" y="637" font-size="21">Attached 必須等於 current1</text><text x="215" y="669" font-size="21">Ready 必須為 true</text><text x="215" y="700" font-size="19">合法後計 RMS；被拒則不更新</text>
<text x="215" y="792" font-size="22">Lab Output=true、RMS600</text><text x="215" y="826" font-size="20">只驗證模型接受非零數值</text>
<text x="215" y="892" font-size="21">真實播放 → 裝置 → 人耳</text><text x="215" y="927" font-size="20">在本模型之外，仍須取得證據</text><text x="215" y="966" font-size="19">這張圖不推定公司模組或依賴</text></g></svg>
