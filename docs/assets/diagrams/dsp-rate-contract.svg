<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">實際C#流水線的取樣率、長度與頻率軸</title><desc id="desc">32份8k實數tone，FIR同長，偶索引抽取為16份4k，名義內容仍4ms。取穩態8份作DFT，bin間距500Hz、k2為1kHz。三tap只用於限定tone，不代表任意抗混疊設計。</desc><rect width="960" height="350" fill="#f8fafc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><g font-family="sans-serif" fill="#172554"><text x="30" y="40" font-size="24">相同內容，降率改長度；顯示軸也要改</text><g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect x="25" y="100" width="185" height="90" rx="8"/><rect x="255" y="100" width="190" height="90" rx="8"/><rect x="490" y="100" width="190" height="90" rx="8"/><rect x="725" y="100" width="210" height="90" rx="8"/></g><g font-size="19" text-anchor="middle"><text x="118" y="130">Tone 1000Hz</text><text x="118" y="163">32份 / fs 8000</text><text x="350" y="130">三tap FIR</text><text x="350" y="163">32份 / fs 8000</text><text x="585" y="130">取偶索引</text><text x="585" y="163">16份 / fs 4000</text><text x="830" y="130">取穩態8份 DFT</text><text x="830" y="163">k2 × 4000/8</text></g><g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"><path d="M210,145 L251,145"/><path d="M445,145 L486,145"/><path d="M680,145 L721,145"/></g><g font-size="18"><text x="30" y="235">名義內容時長：32/8000 = 16/4000 = 4ms；DFT取8份只看其中2ms</text><text x="30" y="274">FIR穩態1k振幅倍率0.853553，群延遲1輸入sample = 0.125ms</text><text x="30" y="313">圖為實跑模型規則；三tap不保證任意帶外輸入的抗混疊。GNU Radio GUI另驗證。</text></g></g></svg>
