<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" role="img" aria-labelledby="title desc"><title id="title">未知介面文件的閱讀順序</title><desc id="desc">先看產品和文件版本，再查端點及認證、欄位及單位、回覆和事件時序，最後確認錯誤與恢復規則。</desc><rect width="850" height="360" rx="18" fill="#f3f7fa"/><text x="28" y="42" font-family="sans-serif" font-size="25" fill="#193246" font-weight="700">讀 ICD／API Manual 的五站</text><g font-family="sans-serif" font-size="18" fill="#193246"><rect x="35" y="69" width="780" height="46" rx="8" fill="#dcebee"/><text x="57" y="98">1　適用版本：文件、韌體、SDK、變更記錄</text><rect x="35" y="124" width="780" height="46" rx="8" fill="#e6e1f4"/><text x="57" y="153">2　端點／認證：誰連誰？怎麼驗證與建立 Session？</text><rect x="35" y="179" width="780" height="46" rx="8" fill="#dcebee"/><text x="57" y="208">3　命令欄位：型別、長度、單位、必要條件</text><rect x="35" y="234" width="780" height="46" rx="8" fill="#e6e1f4"/><text x="57" y="263">4　回覆／事件：Accepted 與完成各指什麼？</text><rect x="35" y="289" width="780" height="46" rx="8" fill="#dcebee"/><text x="57" y="318">5　錯誤／恢復：逾時、重試、重連與未知結果</text></g></svg>
