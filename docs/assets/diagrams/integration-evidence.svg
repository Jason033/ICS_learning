<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="title desc"><title id="title">跨層證據階梯</title><desc id="desc">View 操作、Controller 驗證、Adapter 送出、接受回覆、設備事件和 UI 更新，依序有不同觀測與未知。</desc><rect width="860" height="360" rx="18" fill="#f3f7fa"/><text x="28" y="43" font-family="sans-serif" font-size="25" fill="#193246" font-weight="700">每段只證明自己看到的事</text><g font-family="sans-serif" font-size="18" fill="#193246"><rect x="35" y="75" width="250" height="58" rx="9" fill="#dcebee"/><text x="53" y="111">View：按下按鈕</text><rect x="305" y="75" width="250" height="58" rx="9" fill="#e6e1f4"/><text x="323" y="111">Controller：通過驗證</text><rect x="575" y="75" width="250" height="58" rx="9" fill="#dcebee"/><text x="593" y="111">Adapter：送出請求</text><rect x="35" y="205" width="250" height="58" rx="9" fill="#e6e1f4"/><text x="53" y="241">外部：接受處理</text><rect x="305" y="205" width="250" height="58" rx="9" fill="#dcebee"/><text x="323" y="241">設備：狀態回報</text><rect x="575" y="205" width="250" height="58" rx="9" fill="#e6e1f4"/><text x="593" y="241">UI：更新畫面</text></g><g stroke="#497382" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M285 104h17M555 104h17M700 135v50H163v18M285 234h17M555 234h17"/></g><text x="37" y="320" font-family="sans-serif" font-size="17" fill="#304d5e">若某個箭頭沒有來源與紀錄，就標「未知」，再決定下一個檢查。</text><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#497382"/></marker></defs></svg>
