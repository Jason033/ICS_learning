<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 345" role="img" aria-labelledby="title desc"><title id="title">五種不同的整合狀態</title><desc id="desc">傳輸通道、驗證、Session、設備狀態和 UI 顯示需各自查證，前一層完成不保證後一層完成。</desc><rect width="850" height="345" rx="18" fill="#f3f7fa"/><text x="28" y="45" font-family="sans-serif" font-size="25" fill="#193246" font-weight="700">Connected 到 READY：仍有五段</text><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#193246"><rect x="24" y="110" width="145" height="67" rx="10" fill="#dcebee"/><text x="96" y="137">Transport</text><text x="96" y="160">通道連上</text><rect x="190" y="110" width="145" height="67" rx="10" fill="#e6e1f4"/><text x="262" y="137">Auth</text><text x="262" y="160">身分接受</text><rect x="355" y="110" width="145" height="67" rx="10" fill="#dcebee"/><text x="427" y="137">Session</text><text x="427" y="160">本次有效</text><rect x="520" y="110" width="145" height="67" rx="10" fill="#e6e1f4"/><text x="592" y="137">Device</text><text x="592" y="160">狀態回報</text><rect x="685" y="110" width="145" height="67" rx="10" fill="#dcebee"/><text x="757" y="137">UI</text><text x="757" y="160">畫面顯示</text></g><g stroke="#497382" stroke-width="3" marker-end="url(#a)"><path d="M169 144h18M335 144h17M500 144h17M665 144h17"/></g><text x="31" y="248" font-family="sans-serif" font-size="18" fill="#304d5e">重連時，要重新查新 Session 與權威設備狀態，不能沿用舊畫面。</text><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#497382"/></marker></defs></svg>
