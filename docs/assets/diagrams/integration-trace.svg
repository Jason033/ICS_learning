<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">一次操作的雙向追查</title><desc id="desc">教學模型從 View 經 Controller、Adapter 到虛構設備；回覆和狀態事件沿另一方向返回。每個箭頭都需證據。</desc><rect width="900" height="320" rx="18" fill="#f3f7fa"/><text x="28" y="43" font-family="sans-serif" font-size="25" fill="#193246" font-weight="700">DemoCtrl-A：按鍵與回報分開追</text><g font-family="sans-serif" font-size="19" text-anchor="middle" fill="#193246"><rect x="28" y="91" width="170" height="62" rx="10" fill="#dcebee"/><text x="113" y="128">View</text><rect x="250" y="91" width="170" height="62" rx="10" fill="#e6e1f4"/><text x="335" y="128">Controller</text><rect x="475" y="91" width="170" height="62" rx="10" fill="#dcebee"/><text x="560" y="128">Adapter</text><rect x="700" y="91" width="170" height="62" rx="10" fill="#e6e1f4"/><text x="785" y="128">FakeDevice</text></g><g stroke="#497382" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M198 113h49M420 113h52M645 113h52M700 172H648M475 196H423M250 220H201"/></g><g font-family="sans-serif" font-size="17" fill="#304d5e"><text x="35" y="81">操作 →</text><text x="670" y="201">← Accepted／事件</text><text x="55" y="277">方法返回、接受回覆、設備狀態和畫面更新，需分別記錄。</text></g><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#497382"/></marker></defs></svg>
