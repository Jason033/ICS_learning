<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1110" role="img" aria-labelledby="title desc"><title id="title">一次HTTP狀態查詢的端到端路徑</title><desc id="desc">呼叫端組HTTP要求並交socket與TCP/IP，路由器逐站轉交本地鏈路，伺服器作業系統按Port交給服務程式。HTTP回覆再經傳輸交回呼叫端。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#54738b"/></marker><marker id="replyArrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5e9078"/></marker></defs><rect width="440" height="1110" rx="18" fill="#f7f9fc"/><text x="220" y="39" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1e3856">一次HTTP請求與回覆</text><text x="220" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#54738b">↓ 要求向服務端　　↑ 回覆向呼叫端</text>
<g font-family="sans-serif" text-anchor="middle" fill="#20354f"><rect x="38" y="78" width="364" height="145" rx="18" fill="#e7f0ff" stroke="#7195c6" stroke-width="2"/><text x="220" y="112" font-size="21" font-weight="700">呼叫端應用程式</text><text x="220" y="145" font-size="16">建立 GET /devices/42/status</text><text x="220" y="174" font-size="16">HTTP內容表達要做的工作</text><text x="220" y="203" font-size="15">DNS名稱 → 伺服器IP（若使用名稱）</text>
<rect x="38" y="272" width="364" height="144" rx="18" fill="#e7f0ff" stroke="#7195c6" stroke-width="2"/><text x="220" y="309" font-size="21" font-weight="700">client socket · TCP</text><text x="220" y="344" font-size="17">192.0.2.17:51734 →</text><text x="220" y="373" font-size="17">203.0.113.20:8080</text><text x="220" y="401" font-size="14">本端暫用Port → 服務監聽Port</text>
<rect x="38" y="466" width="364" height="160" rx="18" fill="#fff4d9" stroke="#c79f41" stroke-width="2"/><text x="220" y="504" font-size="21" font-weight="700">IP路由 · 每一段本地鏈路</text><text x="220" y="540" font-size="16">IP目的：203.0.113.20</text><text x="220" y="568" font-size="16">路由選下一跳IP；ARP查本段MAC</text><text x="220" y="598" font-size="15">轉送後建立下一段本地frame</text>
<rect x="38" y="676" width="364" height="144" rx="18" fill="#e4f3ed" stroke="#78ae96" stroke-width="2"/><text x="220" y="714" font-size="21" font-weight="700">伺服器端作業系統</text><text x="220" y="749" font-size="16">IP收到；TCP匹配連線與目的Port</text><text x="220" y="779" font-size="16">bytes排入對應的連線socket</text>
<rect x="38" y="872" width="364" height="138" rx="18" fill="#e4f3ed" stroke="#78ae96" stroke-width="2"/><text x="220" y="912" font-size="21" font-weight="700">HTTP服務程式</text><text x="220" y="948" font-size="16">parser還原request → handler查狀態</text><text x="220" y="978" font-size="16">HTTP response沿回程交給呼叫端</text>
<rect x="60" y="1040" width="320" height="48" rx="22" fill="#dce8ef"/><text x="220" y="1071" font-size="15" font-weight="700">逐層交接，直到呼叫端取得並處理回覆</text></g>
<g stroke="#54738b" stroke-width="3" marker-end="url(#arrow)"><path d="M208 226v34"/><path d="M208 418v38"/><path d="M208 628v38"/><path d="M208 822v40"/></g><g stroke="#5e9078" stroke-width="3" marker-end="url(#replyArrow)"><path d="M232 260v-34"/><path d="M232 456v-38"/><path d="M232 666v-38"/><path d="M232 862v-40"/></g></svg>