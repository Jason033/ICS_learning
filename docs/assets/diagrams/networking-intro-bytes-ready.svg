<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 570" role="img" aria-labelledby="title desc">
  <title id="title">READY與五個byte的關係</title>
  <desc id="desc">B的狀態提供程式把READY按ASCII編碼成五個byte，中間用HEX顯示52 45 41 44 59，A的狀態查詢程式再按ASCII解碼成READY。圖中的中間箭頭略去實際交付路徑。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#475569" stroke-width="2"/></marker></defs>
  <rect width="360" height="570" rx="18" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#172554">
    <rect x="20" y="20" width="320" height="112" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="180" y="52" font-size="20">B的狀態提供程式</text>
    <text x="180" y="100" font-size="32" font-weight="700">READY</text>
    <path d="M180 139 L180 211" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="73" y="158" width="214" height="30" fill="#f8fafc"/>
    <text x="180" y="181" font-size="19">按ASCII編碼</text>
    <rect x="20" y="225" width="320" height="114" rx="14" fill="#fef3c7" stroke="#d97706"/>
    <text x="180" y="256" font-size="19">5 bytes，用HEX顯示</text>
    <text x="180" y="298" font-size="26" font-family="monospace" font-weight="700">52 45 41 44 59</text>
    <text x="180" y="325" font-size="16">每兩位顯示一個byte</text>
    <path d="M180 347 L180 436" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="64" y="359" width="232" height="54" fill="#f8fafc"/>
    <text x="180" y="381" font-size="17">交付路徑留到下一篇</text>
    <text x="180" y="406" font-size="19">A再按ASCII解碼</text>
    <rect x="20" y="450" width="320" height="100" rx="14" fill="#dcfce7" stroke="#16a34a"/>
    <text x="180" y="480" font-size="20">A的狀態查詢程式</text>
    <text x="180" y="528" font-size="32" font-weight="700">READY</text>
  </g>
</svg>
