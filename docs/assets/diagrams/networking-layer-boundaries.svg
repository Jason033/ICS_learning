<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">端到端資料與逐跳外衣</title><desc id="desc">A應用送八位元組，TCP與IP外層保持兩端識別，每個Ethernet鏈路使用不同MAC。路由器轉送時TTL減一。</desc><rect width="1000" height="560" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" fill="#16324f"><text x="40" y="50" font-size="28">同一份查詢：端到端資料，逐跳鏈路外衣</text><text x="40" y="87" font-size="18">無 NAT、IPv4/TCP 無 options 的教學模型</text><rect x="40" y="115" width="920" height="75" rx="10" fill="#d9eee7"/><text x="60" y="145" font-size="21">應用：STATUS? + LF → 8 bytes</text><text x="60" y="173" font-size="17">終止符、解析與 READY 成功語意由應用契約決定</text><rect x="40" y="205" width="920" height="65" rx="10" fill="#ddeafb"/><text x="60" y="235" font-size="21">TCP：A:54000 → B:7000；SEQ / ACK / Window</text><text x="60" y="258" font-size="17">20-byte TCP 頭 + 8-byte 資料；ACK 確認 bytes</text><rect x="40" y="285" width="920" height="65" rx="10" fill="#e6e2f5"/><text x="60" y="316" font-size="21">IPv4：192.0.2.10 → 198.51.100.20；TTL 64 → 63</text><text x="60" y="339" font-size="17">20-byte IP 頭 + TCP 28 = IP total 48 bytes</text><rect x="40" y="372" width="370" height="105" rx="10" fill="#fff0d5"/><text x="58" y="402" font-size="21">鏈路一：A-MAC → G1-MAC</text><text x="58" y="435" font-size="17">A 用 ARP 找本地下一站 G1</text><rect x="590" y="372" width="370" height="105" rx="10" fill="#fff0d5"/><text x="608" y="402" font-size="21">鏈路二：G2-MAC → B-MAC</text><text x="608" y="435" font-size="17">路由器重建鏈路 frame</text><path d="M425 421h145" stroke="#16324f" stroke-width="3"/><path d="m557 412 15 9-15 9" fill="none" stroke="#16324f" stroke-width="3"/><text x="442" y="400" font-size="18">路由器</text><text x="40" y="525" font-size="18">每層完成的含義不同：本機 write ≠ TCP ACK ≠ 完整訊息 ≠ 業務結果</text></g></svg>
