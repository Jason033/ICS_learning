<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" role="img" aria-labelledby="title desc">
  <title id="title">Ozeki 教學範例的雙向音訊路徑</title>
  <desc id="desc">送出方向由麥克風經 Connector 與 AudioSender 附著到通話；接收方向由通話經 AudioReceiver 與 Connector 送到喇叭。</desc>
  <rect width="420" height="640" rx="20" fill="#f7faf5"/>
  <text x="24" y="37" fill="#0c5145" font-size="17" font-weight="700" font-family="Arial, sans-serif">音訊要分兩個方向檢查</text>
  <rect x="24" y="56" width="372" height="255" rx="14" fill="#e2f0e5" stroke="#b7d6c2"/>
  <text x="43" y="86" fill="#0c5145" font-size="17" font-weight="700" font-family="Arial, sans-serif">送出：我 → 對方</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#133b35" font-size="15" font-weight="700">
    <rect x="72" y="100" width="276" height="40" rx="9" fill="#fff"/><text x="210" y="126">麥克風／輸入來源</text>
    <rect x="72" y="154" width="276" height="40" rx="9" fill="#fff"/><text x="210" y="180">MediaConnector → AudioSender</text>
    <rect x="72" y="208" width="276" height="40" rx="9" fill="#fff"/><text x="210" y="234">附著到指定 IPhoneCall</text>
    <text x="210" y="283" fill="#315f51" font-size="13" font-weight="400">之後還要看 RTP 與對端接收</text>
  </g>
  <rect x="24" y="330" width="372" height="255" rx="14" fill="#fff" stroke="#cddfd2"/>
  <text x="43" y="360" fill="#0c5145" font-size="17" font-weight="700" font-family="Arial, sans-serif">接收：對方 → 我</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#133b35" font-size="15" font-weight="700">
    <rect x="72" y="374" width="276" height="40" rx="9" fill="#e2f0e5"/><text x="210" y="400">指定 IPhoneCall 收到媒體</text>
    <rect x="72" y="428" width="276" height="40" rx="9" fill="#e2f0e5"/><text x="210" y="454">AudioReceiver → MediaConnector</text>
    <rect x="72" y="482" width="276" height="40" rx="9" fill="#e2f0e5"/><text x="210" y="508">喇叭／輸出裝置</text>
    <text x="210" y="557" fill="#315f51" font-size="13" font-weight="400">RTP 到達不等於喇叭出聲</text>
  </g>
  <g stroke="#0d6555" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 143v9m-5-5 5 5 5-5M210 197v9m-5-5 5 5 5-5M210 417v9m-5-5 5 5 5-5M210 471v9m-5-5 5 5 5-5"/>
  </g>
  <text x="210" y="615" text-anchor="middle" fill="#4b6b60" font-size="12" font-family="Arial, sans-serif">自製教學示意；實際連接依專案和 SDK 版本核對</text>
</svg>
