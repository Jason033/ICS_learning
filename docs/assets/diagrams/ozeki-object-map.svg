<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
<title id="title">電話核心、線路、通話與包裝的不同責任</title><desc id="desc">包裝呼叫電話核心，核心建立線路；兩個獨立通話使用同一線路，各自保存事件和媒體。使用關係不等同擁有關係。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#356b58"/></marker></defs>
<rect width="1000" height="570" rx="18" fill="#f7faf6"/>
<g font-family="sans-serif" fill="#203f35"><text x="36" y="45" font-size="25" font-weight="bold">物件圖：每個方塊是不同責任與壽命</text>
<rect x="36" y="80" width="290" height="100" rx="12" fill="#e3eee3" stroke="#93b19e"/><text x="58" y="113" font-size="22">應用包裝層</text><text x="58" y="145" font-size="17">操作規則、紀錄、UI映射</text>
<rect x="384" y="80" width="274" height="100" rx="12" fill="#dfede8" stroke="#93b19e"/><text x="408" y="113" font-size="22">ISoftPhone 核心 E1</text><text x="408" y="145" font-size="17">建立線路／通話、來電入口</text>
<rect x="710" y="80" width="252" height="100" rx="12" fill="#e5eafb" stroke="#99a8c8"/><text x="734" y="113" font-size="22">IPhoneLine L1</text><text x="734" y="145" font-size="17">帳號、註冊狀態</text>
<path d="M326 130 H378 M658 130 H704" stroke="#356b58" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="146" y="272" width="310" height="144" rx="12" fill="#fff" stroke="#93b19e"/><text x="170" y="306" font-size="22">IPhoneCall C1</text><text x="170" y="338" font-size="17">一次呼叫的狀態與控制</text><text x="170" y="369" font-size="17">自己的事件、媒體附著</text><text x="170" y="397" font-size="17">結束時只清自己的範圍</text>
<rect x="560" y="272" width="310" height="144" rx="12" fill="#fff" stroke="#93b19e"/><text x="584" y="306" font-size="22">IPhoneCall C2</text><text x="584" y="338" font-size="17">另一通、獨立狀態與控制</text><text x="584" y="369" font-size="17">可共用L1，但不等於C1</text><text x="584" y="397" font-size="17">舊C1事件不能清掉C2</text>
<path d="M300 272 V228 H800 V188 M715 272 V228 H800" stroke="#356b58" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="405" y="220" font-size="17">使用同一條 L1</text>
<rect x="36" y="458" width="926" height="78" rx="10" fill="#f6eddc"/><text x="56" y="488" font-size="18">使用不等於擁有：C1結束，不代表可釋放仍被C2使用的線路或裝置。</text><text x="56" y="517" font-size="17">箭頭是教學關係；實際SDK建立與釋放契約需對照目前組件。</text>
</g></svg>
