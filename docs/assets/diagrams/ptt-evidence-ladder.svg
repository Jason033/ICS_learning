<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612" role="img" aria-labelledby="title desc">
  <title id="title">按下 PTT 後的六段證據</title>
  <desc id="desc">依序核對按鍵、程式事件、控制請求、設備狀態、音訊與射頻、對端接收。上一段成功不代表下一段成功。</desc>
  <rect width="640" height="612" rx="26" fill="#f6f8f4"/>
  <text x="30" y="45" fill="#14342e" font-size="25" font-weight="700" font-family="sans-serif">按下 PTT，要逐段找證據</text>
  <g font-family="sans-serif" fill="#14342e">
    <rect x="30" y="72" width="580" height="66" rx="12" fill="#e6e9f7"/>
    <text x="52" y="101" font-size="20" font-weight="700">1  按鍵</text><text x="52" y="126" font-size="16">人真的按下了嗎？哪個輸入源？</text>
    <rect x="30" y="148" width="580" height="66" rx="12" fill="#dcefe7"/>
    <text x="52" y="177" font-size="20" font-weight="700">2  程式事件</text><text x="52" y="202" font-size="16">程式收到同一次按鍵嗎？</text>
    <rect x="30" y="224" width="580" height="66" rx="12" fill="#fff0d9"/>
    <text x="52" y="253" font-size="20" font-weight="700">3  控制請求</text><text x="52" y="278" font-size="16">PTT 命令是否真正送出？</text>
    <rect x="30" y="300" width="580" height="66" rx="12" fill="#f8e7df"/>
    <text x="52" y="329" font-size="20" font-weight="700">4  設備狀態</text><text x="52" y="354" font-size="16">設備有沒有回報 TX 或拒絕？</text>
    <rect x="30" y="376" width="580" height="66" rx="12" fill="#e6e9f7"/>
    <text x="52" y="405" font-size="20" font-weight="700">5  音訊與射頻</text><text x="52" y="430" font-size="16">聲音有進設備？空中路徑可用？</text>
    <rect x="30" y="452" width="580" height="66" rx="12" fill="#dcefe7"/>
    <text x="52" y="481" font-size="20" font-weight="700">6  對端接收</text><text x="52" y="506" font-size="16">對端可接收、解碼且聽見嗎？</text>
    <text x="320" y="558" text-anchor="middle" font-size="17">每一格都要附時間與觀測來源</text>
  </g>
  <text x="320" y="590" text-anchor="middle" fill="#52645c" font-size="14" font-family="sans-serif">自製教學模型；不代表實際公司架構</text>
</svg>
