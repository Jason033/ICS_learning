<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="title desc"><title id="title">逾時後，結果可能仍在路上</title><desc id="desc">0 毫秒送出，50 毫秒本地逾時，70 毫秒遠端完成；單次等待與整筆期限不同。</desc><rect width="900" height="290" rx="18" fill="#f3f7fa"/><g font-family="sans-serif" fill="#193246"><text x="24" y="48" font-size="26" font-weight="700">逾時後，結果可能仍在路上</text><rect x="24" y="92" width="204" height="122" rx="12" fill="#dcebee"/><text x="36" y="130" font-size="19" font-weight="700">0 ms</text><text x="36" y="168" font-size="16">送出 id=7</text><rect x="240" y="92" width="204" height="122" rx="12" fill="#e6e1f4"/><text x="252" y="130" font-size="19" font-weight="700">50 ms</text><text x="252" y="168" font-size="16">本地逾時</text><rect x="456" y="92" width="204" height="122" rx="12" fill="#dcebee"/><text x="468" y="130" font-size="19" font-weight="700">70 ms</text><text x="468" y="168" font-size="16">遠端完成</text><rect x="672" y="92" width="204" height="122" rx="12" fill="#e6e1f4"/><text x="684" y="130" font-size="19" font-weight="700">總期限</text><text x="684" y="168" font-size="16">仍需單獨設定</text><text x="24" y="255" font-size="17">50 ms 能說「尚未確認」，不能說「未執行」。</text></g></svg>
