<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="title desc"><title id="title">一個操作，逐層留下證據</title><desc id="desc">操作 ID 連結送出、排隊、遠端回報、狀態查詢與畫面更新。</desc><rect width="900" height="290" rx="18" fill="#f3f7fa"/><g font-family="sans-serif" fill="#193246"><text x="24" y="48" font-size="26" font-weight="700">一個操作，逐層留下證據</text><rect x="24" y="92" width="204" height="122" rx="12" fill="#dcebee"/><text x="36" y="130" font-size="19" font-weight="700">操作 id=7</text><text x="36" y="168" font-size="16">開始／嘗試</text><rect x="240" y="92" width="204" height="122" rx="12" fill="#e6e1f4"/><text x="252" y="130" font-size="19" font-weight="700">排隊</text><text x="252" y="168" font-size="16">入隊／出隊</text><rect x="456" y="92" width="204" height="122" rx="12" fill="#dcebee"/><text x="468" y="130" font-size="19" font-weight="700">遠端</text><text x="468" y="168" font-size="16">接受／完成</text><rect x="672" y="92" width="204" height="122" rx="12" fill="#e6e1f4"/><text x="684" y="130" font-size="19" font-weight="700">畫面</text><text x="684" y="168" font-size="16">狀態／版本</text><text x="24" y="255" font-size="17">方法返回、遠端接受與設備完成是不同層。</text></g></svg>
