<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="title desc"><title id="title">先發生，不一定先送達</title><desc id="desc">會話 A 的版本四十一先產生卻較晚送達，版本四十二先被收到。</desc><rect width="900" height="290" rx="18" fill="#f3f7fa"/><g font-family="sans-serif" fill="#193246"><text x="24" y="48" font-size="26" font-weight="700">先發生，不一定先送達</text><rect x="24" y="92" width="204" height="122" rx="12" fill="#dcebee"/><text x="36" y="130" font-size="19" font-weight="700">20 ms 產生</text><text x="36" y="168" font-size="16">A / seq 41 Ready</text><rect x="240" y="92" width="204" height="122" rx="12" fill="#e6e1f4"/><text x="252" y="130" font-size="19" font-weight="700">40 ms 產生</text><text x="252" y="168" font-size="16">A / seq 42 Busy</text><rect x="456" y="92" width="204" height="122" rx="12" fill="#dcebee"/><text x="468" y="130" font-size="19" font-weight="700">50 ms 收到</text><text x="468" y="168" font-size="16">先套用 42</text><rect x="672" y="92" width="204" height="122" rx="12" fill="#e6e1f4"/><text x="684" y="130" font-size="19" font-weight="700">70 ms 收到</text><text x="684" y="168" font-size="16">41 不應覆蓋 42</text><text x="24" y="255" font-size="17">序號只能在產品契約定義的來源與會話範圍內比較。</text></g></svg>
