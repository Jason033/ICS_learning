<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="title desc"><title id="title">入口比出口快，隊伍會增長</title><desc id="desc">每秒進來八件、處理五件，假設速率固定且未丟棄，每秒多三件。</desc><rect width="900" height="290" rx="18" fill="#f3f7fa"/><g font-family="sans-serif" fill="#193246"><text x="24" y="48" font-size="26" font-weight="700">入口比出口快，隊伍會增長</text><rect x="24" y="92" width="276" height="122" rx="12" fill="#dcebee"/><text x="36" y="130" font-size="19" font-weight="700">來源</text><text x="36" y="168" font-size="16">8 件／秒</text><rect x="312" y="92" width="276" height="122" rx="12" fill="#e6e1f4"/><text x="324" y="130" font-size="19" font-weight="700">有界 Queue</text><text x="324" y="168" font-size="16">每秒多 3 件</text><rect x="600" y="92" width="276" height="122" rx="12" fill="#dcebee"/><text x="612" y="130" font-size="19" font-weight="700">處理端</text><text x="612" y="168" font-size="16">5 件／秒</text><text x="24" y="255" font-size="17">同時量入隊、出隊、最老等待時間和丟棄數。</text></g></svg>
