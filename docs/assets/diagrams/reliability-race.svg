<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="title desc"><title id="title">兩個工作讀到同一個舊值</title><desc id="desc">A 和 B 都讀到零，各自計算一並寫回，最後只增加一次。</desc><rect width="900" height="290" rx="18" fill="#f3f7fa"/><g font-family="sans-serif" fill="#193246"><text x="24" y="48" font-size="26" font-weight="700">兩個工作讀到同一個舊值</text><rect x="24" y="92" width="204" height="122" rx="12" fill="#dcebee"/><text x="36" y="130" font-size="19" font-weight="700">A 讀取</text><text x="36" y="168" font-size="16">count = 0</text><rect x="240" y="92" width="204" height="122" rx="12" fill="#e6e1f4"/><text x="252" y="130" font-size="19" font-weight="700">B 讀取</text><text x="252" y="168" font-size="16">count = 0</text><rect x="456" y="92" width="204" height="122" rx="12" fill="#dcebee"/><text x="468" y="130" font-size="19" font-weight="700">A 寫回</text><text x="468" y="168" font-size="16">count = 1</text><rect x="672" y="92" width="204" height="122" rx="12" fill="#e6e1f4"/><text x="684" y="130" font-size="19" font-weight="700">B 寫回</text><text x="684" y="168" font-size="16">count = 1</text><text x="24" y="255" font-size="17">Lock 應包住完整的讀取→修改→寫回。</text></g></svg>
