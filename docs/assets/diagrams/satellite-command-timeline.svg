<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc"><title id="title">對稱教學路徑的命令與回覆時間</title><desc id="desc">同一邏輯毫秒軸：0送出，273到達，303工作完成，576收到回覆。每向72000km、1000byte、1Mbit/s、排隊20ms、網路處理5ms；遠端業務另30ms。</desc><rect width="960" height="320" fill="#f8fafc"/><g font-family="sans-serif" fill="#172554"><text x="35" y="40" font-size="23">一筆命令走完：回覆不是在 Send 時完成</text><text x="35" y="72" font-size="16">教學假設：每方向對稱；所有事件同一邏輯時軸，單位 ms</text><line x1="90" y1="150" x2="870" y2="150" stroke="#334155" stroke-width="3"/><rect x="90" y="120" width="327.6" height="32" rx="4" fill="#2563eb"/><rect x="417.6" y="120" width="36" height="32" rx="4" fill="#d97706"/><rect x="453.6" y="120" width="327.6" height="32" rx="4" fill="#0f766e"/><g font-size="17"><text x="95" y="112">去程 273ms</text><text x="466" y="112">返程 273ms</text><text x="365" y="90">遠端業務 30ms</text><text x="86" y="182">0</text><text x="393" y="182">273</text><text x="447" y="204">303</text><text x="762" y="182">576</text><text x="80" y="229">送出</text><text x="352" y="229">對端收到</text><text x="447" y="229">工作完成</text><text x="728" y="229">收到結果</text><text x="35" y="269">每向 240ms 傳播 + 8ms 序列化 + 20ms 排隊 + 5ms 網路處理 = 273ms</text><text x="35" y="299">500ms 停止等待時，遠端已完成；回覆仍在返程。總回覆 273 + 30 + 273 = 576ms</text></g></g></svg>
