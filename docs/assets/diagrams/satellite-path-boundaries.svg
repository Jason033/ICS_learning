<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">衛星與地面路徑的觀測邊界</title><desc id="desc">電腦到終端管理介面只證明區域性可達；終端經上行到衛星、下行到地面gateway，隨後才到業務服務。反向另需一條返回路徑，下載請求仍可能先經上行。</desc><rect width="960" height="340" fill="#f8fafc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker></defs><g font-family="sans-serif" fill="#172554"><text x="30" y="38" font-size="24">資料路徑與管理介面：不同證據範圍</text><g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect x="35" y="195" width="140" height="55" rx="8"/><rect x="220" y="195" width="160" height="55" rx="8"/><rect x="395" y="70" width="160" height="55" rx="8"/><rect x="590" y="195" width="160" height="55" rx="8"/><rect x="795" y="195" width="135" height="55" rx="8"/></g><g font-size="19" text-anchor="middle"><text x="105" y="230">電腦／內網</text><text x="300" y="230">衛星終端</text><text x="475" y="106">衛星功能</text><text x="670" y="230">地面 gateway</text><text x="862" y="230">業務服務</text></g><g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"><path d="M175,222 L217,222"/><path d="M345,192 L431,128"/><path d="M531,128 L627,192"/><path d="M750,222 L791,222"/></g><g font-size="18"><text x="315" y="156">上行</text><text x="568" y="156">下行</text><text x="32" y="285">區域性管理可達 ≠ 上行准入 ≠ 下行解碼 ≠ 閘道轉送 ≠ 業務完成</text><text x="32" y="317">圖為功能示意；不表示實際公司拓撲，返回方向與星間路徑需另核對。</text></g></g></svg>
