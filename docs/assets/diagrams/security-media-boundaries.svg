<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 672" role="img" aria-labelledby="title desc"><title id="title">信令、媒體與隧道的保護邊界</title><desc id="desc">教學路徑A到B中間有VPN閘道，隧道只保護GW1到GW2；SIP信令TLS與SRTP分開，解密端點與每方向上下文決定實際保護範圍。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c6c94"/></marker></defs><rect width="760" height="672" fill="#f4f7fc"/><g font-family="sans-serif"><text x="36" y="45" font-size="25" fill="#18334d">信令、媒體與隧道的保護邊界</text>
<rect x="36" y="72" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="100" font-size="21" fill="#18334d">應用A → GW1：第一段接入</text><text x="58" y="128" font-size="18" fill="#344b63">只知道中間VPNConnected，不能推論這段保密</text><text x="58" y="154" font-size="18" fill="#344b63">觀察：A實際送出的是明文RTP還是受保護SRTP</text>
<path d="M380 172 L380 198" stroke="#4c6c94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="200" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="228" font-size="21" fill="#18334d">GW1 → GW2：VPN隧道</text><text x="58" y="256" font-size="18" fill="#344b63">隧道保護選入的內部流量；封裝也增加外部長度</text><text x="58" y="282" font-size="18" fill="#344b63">觀察：選路、流量選擇、SA方向、MTU及解密位置</text>
<path d="M380 300 L380 326" stroke="#4c6c94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="328" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="356" font-size="21" fill="#18334d">GW2 → 應用B：最後一段接入</text><text x="58" y="384" font-size="18" fill="#344b63">若閘道解密後仍傳明文，完整路徑條件不成立</text><text x="58" y="410" font-size="18" fill="#344b63">觀察：出口抓包與端點；不能只看隧道建立事件</text>
<path d="M380 428 L380 454" stroke="#4c6c94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="456" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="484" font-size="21" fill="#18334d">另讀兩種責任：信令TLS／媒體SRTP</text><text x="58" y="512" font-size="18" fill="#344b63">SIP回應成功不等於媒體context、key與profile一致</text><text x="58" y="538" font-size="18" fill="#344b63">觀察：A→B與B→A分開；認證失敗可造成單向無聲</text>
<text x="36" y="622" font-size="18" fill="#344b63">一般教學路徑；公司實際端點、解密與部署仍需證據。</text></g></svg>
