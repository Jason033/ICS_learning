<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 672" role="img" aria-labelledby="title desc"><title id="title">TLS服務身分：各項責任共同成立</title><desc id="desc">根由本地可信政策選定，鏈驗證不能替代名稱、用途與日期；TLS協定完成後仍有應用認證授權，離線模型沒有驗撤銷或真正握手。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c6c94"/></marker></defs><rect width="760" height="672" fill="#f4f7fc"/><g font-family="sans-serif"><text x="36" y="45" font-size="25" fill="#18334d">TLS服務身分：各項責任共同成立</text>
<rect x="36" y="72" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="100" font-size="21" fill="#18334d">先決條件：本地可信根與參考服務名稱</text><text x="58" y="128" font-size="18" fill="#344b63">根的自簽不是信任來源；不能從外部請求決定可信根</text><text x="58" y="154" font-size="18" fill="#344b63">觀察：政策使用哪個根、連線原本要到哪個服務</text>
<path d="M380 172 L380 198" stroke="#4c6c94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="200" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="228" font-size="21" fill="#18334d">鏈與時間：簽章、CA約束與有效期</text><text x="58" y="256" font-size="18" fill="#344b63">離線模型固定2030日期，不下載issuer、不查撤銷</text><text x="58" y="282" font-size="18" fill="#344b63">觀察：X509Chain政策與結果；不把NoCheck當正式策略</text>
<path d="M380 300 L380 326" stroke="#4c6c94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="328" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="356" font-size="21" fill="#18334d">名稱與用途：SAN＋serverAuth</text><text x="58" y="384" font-size="18" fill="#344b63">同一可信根也可簽出其他服務或clientAuth憑證</text><text x="58" y="410" font-size="18" fill="#344b63">觀察：MatchesHostname及明確EKU，各自保留結果</text>
<path d="M380 428 L380 454" stroke="#4c6c94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="456" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="484" font-size="21" fill="#18334d">真正TLS通道 → 應用認證 → 資源授權</text><text x="58" y="512" font-size="18" fill="#344b63">握手完成仍不能證明Reader有tx.start權限</text><text x="58" y="538" font-size="18" fill="#344b63">觀察：同一請求的主體、動作、資源與拒絕層</text>
<text x="36" y="622" font-size="18" fill="#344b63">四層箭頭表示前置責任，不是完整TLS協定時序圖。</text></g></svg>
