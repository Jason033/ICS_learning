<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-labelledby="title desc">
<title id="title">TCP 位元組串流與訊息框架</title><desc id="desc">兩次應用送出可分三次讀取；接收程式依長度前綴還原兩則訊息。</desc>
<rect width="800" height="290" rx="18" fill="#f3f7fa"/>
<g font-family="sans-serif" fill="#193246" font-size="19"><text x="35" y="48">應用送出</text><text x="35" y="132">Socket 讀取</text><text x="35" y="226">解析後</text></g>
<g font-family="monospace" font-size="17" text-anchor="middle" fill="#193246"><rect x="180" y="24" width="245" height="44" rx="7" fill="#d9eced"/><text x="302" y="52">00 07 STATUS?</text><rect x="435" y="24" width="265" height="44" rx="7" fill="#e6e1f4"/><text x="567" y="52">00 08 OK,READY</text><rect x="180" y="108" width="105" height="44" rx="7" fill="#d9eced"/><text x="232" y="136">00</text><rect x="295" y="108" width="270" height="44" rx="7" fill="#d9eced"/><text x="430" y="136">07 STATUS? 00</text><rect x="575" y="108" width="190" height="44" rx="7" fill="#e6e1f4"/><text x="670" y="136">08 OK,READY</text><rect x="180" y="203" width="245" height="44" rx="7" fill="#d9eced"/><text x="302" y="231">請求：7 bytes</text><rect x="435" y="203" width="265" height="44" rx="7" fill="#e6e1f4"/><text x="567" y="231">回覆：8 bytes</text></g>
<path d="M440 78V97" stroke="#497382" stroke-width="3" marker-end="url(#arrow)"/><path d="M440 162V192" stroke="#497382" stroke-width="3" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#497382"/></marker></defs>
</svg>
