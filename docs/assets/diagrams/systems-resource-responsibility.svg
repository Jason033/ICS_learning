<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 672" role="img" aria-labelledby="title desc"><title id="title">程序、資源與業務完成的責任</title><desc id="desc">教學流程由程序身分、資源入口、執行緒進度到業務完成，每層提供不同觀察；箭頭不代表公司真實模塊。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c6c94"/></marker></defs><rect width="760" height="100%" fill="#f4f7fc"/><g font-family="sans-serif"><text x="36" y="45" font-size="25" fill="#18334d">程序、資源與業務完成的責任</text>
<rect x="36" y="72" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="100" font-size="21" fill="#18334d">程序實例：主機＋世代＋PID＋開始時間</text><text x="58" y="128" font-size="18" fill="#344b63">提供位址空間、執行身分與資源表</text><text x="58" y="154" font-size="18" fill="#344b63">觀察：程序存在；不保證業務有進展</text>
<path d="M380 172 L380 198" stroke="#4c6c94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="200" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="228" font-size="21" fill="#18334d">執行緒：執行、可執行或等待</text><text x="58" y="256" font-size="18" fill="#344b63">排程器給CPU；鎖與I/O可使工作等待</text><text x="58" y="282" font-size="18" fill="#344b63">觀察：堆疊與進度；低CPU不等於正常</text>
<path d="M380 300 L380 326" stroke="#4c6c94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="328" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="356" font-size="21" fill="#18334d">Handle／FD：取得、轉交與釋放</text><text x="58" y="384" font-size="18" fill="#344b63">本地資源參考依所有權與權限操作</text><text x="58" y="410" font-size="18" fill="#344b63">觀察：取得錯誤、持有者及同世代淨增量</text>
<path d="M380 428 L380 454" stroke="#4c6c94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="456" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="484" font-size="21" fill="#18334d">應用條件：解析、授權與完成</text><text x="58" y="512" font-size="18" fill="#344b63">端點存在只覆蓋傳輸入口</text><text x="58" y="538" font-size="18" fill="#344b63">觀察：同request的業務結果與回歸</text>
<text x="36" y="622" font-size="18" fill="#344b63">先確認是哪一層、哪個實例，再把證據接到同一請求。</text></g></svg>
