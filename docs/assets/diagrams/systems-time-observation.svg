<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 672" role="img" aria-labelledby="title desc"><title id="title">同一事件的三種時間</title><desc id="desc">業務階段發生後，經記錄、緩衝、保存與顯示；UTC用於日期，單調時間用於本機經過，跨機比較需要offset範圍。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c6c94"/></marker></defs><rect width="760" height="100%" fill="#f4f7fc"/><g font-family="sans-serif"><text x="36" y="45" font-size="25" fill="#18334d">同一事件的三種時間</text>
<rect x="36" y="72" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="100" font-size="21" fill="#18334d">業務發生 → 記錄呼叫</text><text x="58" y="128" font-size="18" fill="#344b63">來源程序、instance、request與stage</text><text x="58" y="154" font-size="18" fill="#344b63">記錄點可能晚於真正業務事件</text>
<path d="M380 172 L380 198" stroke="#4c6c94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="200" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="228" font-size="21" fill="#18334d">緩衝 → 保存 → 查詢顯示</text><text x="58" y="256" font-size="18" fill="#344b63">級別、容量、速率限制、權限影響可見性</text><text x="58" y="282" font-size="18" fill="#344b63">沒有顯示 ≠ 沒有發生；先確認範圍</text>
<path d="M380 300 L380 326" stroke="#4c6c94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="328" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="356" font-size="21" fill="#18334d">UTC日期與本機單調elapsed</text><text x="58" y="384" font-size="18" fill="#344b63">日期用來定位，elapsed用來算本機期限</text><text x="58" y="410" font-size="18" fill="#344b63">兩臺主機的elapsed不能直接相減</text>
<path d="M380 428 L380 454" stroke="#4c6c94" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="456" width="688" height="100" rx="12" fill="white" stroke="#779cc4"/><text x="58" y="484" font-size="21" fill="#18334d">跨機：校正時間＝讀數 − offset</text><text x="58" y="512" font-size="18" fill="#344b63">有offset範圍，就求出延遲上下限</text><text x="58" y="538" font-size="18" fill="#344b63">範圍跨過門檻時，補證據而非取一個漂亮數字</text>
<text x="36" y="622" font-size="18" fill="#344b63">圖為一般教學責任，不是實測公司時鐘或日誌管線。</text></g></svg>
