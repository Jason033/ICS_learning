<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 275" role="img" aria-labelledby="title desc">
<title id="title">一個方向的音訊鏈</title><desc id="desc">麥克風接收類比聲音，ADC 取樣成 PCM，Codec 編碼，RTP 傳送，接收端解碼和緩衝，DAC 送到喇叭。</desc>
<rect width="900" height="275" rx="18" fill="#f3f7fa"/><text x="28" y="43" font-family="sans-serif" font-size="25" fill="#193246" font-weight="700">A → B 音訊路徑</text>
<g font-family="sans-serif" font-size="19" text-anchor="middle" fill="#193246"><rect x="20" y="95" width="120" height="68" rx="10" fill="#dcebee"/><text x="80" y="135">麥克風</text><rect x="165" y="95" width="120" height="68" rx="10" fill="#e6e1f4"/><text x="225" y="135">ADC／PCM</text><rect x="310" y="95" width="120" height="68" rx="10" fill="#dcebee"/><text x="370" y="135">Codec 編碼</text><rect x="455" y="95" width="120" height="68" rx="10" fill="#e6e1f4"/><text x="515" y="135">RTP</text><rect x="600" y="95" width="120" height="68" rx="10" fill="#dcebee"/><text x="660" y="135">解碼／緩衝</text><rect x="745" y="95" width="135" height="68" rx="10" fill="#e6e1f4"/><text x="812" y="135">DAC／喇叭</text></g>
<g stroke="#497382" stroke-width="3" marker-end="url(#arrow)"><path d="M140 129h22M285 129h22M430 129h22M575 129h22M720 129h22"/></g><text x="28" y="223" font-family="sans-serif" font-size="18" fill="#304d5e">B → A 是另一條相反方向的鏈；任何一段都可能單獨出問題。</text><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#497382"/></marker></defs>
</svg>
