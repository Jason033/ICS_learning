<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" role="img" aria-labelledby="title desc">
<title id="title">抖動緩衝和播放期限</title><desc id="desc">封包到達時間不均；緩衝可暫存早到封包，晚於播放期限的封包可能被丟棄，增大緩衝也增加延遲。</desc>
<rect width="860" height="310" rx="18" fill="#f3f7fa"/><text x="30" y="47" font-family="sans-serif" font-size="25" fill="#193246" font-weight="700">Jitter buffer：等待換穩定</text>
<g font-family="sans-serif" font-size="18" fill="#193246"><text x="30" y="110">到達</text><text x="30" y="195">緩衝</text><text x="30" y="269">播放</text></g>
<g font-family="sans-serif" text-anchor="middle" font-size="16" fill="#193246"><rect x="180" y="78" width="105" height="45" rx="8" fill="#dcebee"/><text x="232" y="106">早到 10</text><rect x="330" y="78" width="105" height="45" rx="8" fill="#dcebee"/><text x="382" y="106">準時 11</text><rect x="690" y="78" width="115" height="45" rx="8" fill="#f9ded6"/><text x="747" y="106">晚到 12</text><rect x="180" y="163" width="430" height="50" rx="10" fill="#e6e1f4"/><text x="395" y="194">接收緩衝：按播放時刻取資料</text><rect x="315" y="242" width="160" height="42" rx="9" fill="#dcebee"/><text x="395" y="268">播放期限</text></g>
<g stroke="#497382" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M232 125v35M382 125v35M395 214v25"/></g><path d="M747 125v58H615" stroke="#a45142" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#redarrow)" fill="none"/><text x="635" y="228" font-family="sans-serif" font-size="16" fill="#a45142">可能錯過期限</text><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#497382"/></marker><marker id="redarrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a45142"/></marker></defs>
</svg>
