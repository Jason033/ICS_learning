<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" role="img" aria-labelledby="title desc">
<title id="title">SIP 邏輯角色示意</title><desc id="desc">UA 對 Registrar 註冊，Proxy 可轉送 INVITE；媒體方向另外由 SDP 與實際 RTP 確認。</desc>
<rect width="850" height="320" rx="18" fill="#f3f7fa"/><g font-family="sans-serif" fill="#193246" text-anchor="middle" font-size="20">
<rect x="35" y="90" width="190" height="70" rx="12" fill="#dcebee"/><text x="130" y="132">UA：A</text><rect x="325" y="20" width="200" height="70" rx="12" fill="#e6e1f4"/><text x="425" y="62">Registrar</text><rect x="325" y="125" width="200" height="70" rx="12" fill="#e6e1f4"/><text x="425" y="167">Proxy</text><rect x="625" y="90" width="190" height="70" rx="12" fill="#dcebee"/><text x="720" y="132">UA：B</text>
<text x="280" y="50" font-size="16">REGISTER</text><text x="280" y="145" font-size="16">INVITE</text><text x="575" y="145" font-size="16">轉送</text><text x="425" y="270" font-size="18">媒體路徑另查 SDP 與雙向 RTP</text></g>
<g stroke="#497382" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M200 91L325 53"/><path d="M225 138H325"/><path d="M525 138H625"/><path d="M215 205H625"/></g><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#497382"/></marker></defs>
</svg>
