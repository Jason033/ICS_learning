<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="q17 請求：沿標頭長度定位 payload"><rect width="900" height="540" fill="#f3f6fa"/><g font-family="sans-serif" fill="#17283e"><text x="40" y="48" font-size="25" font-weight="700">q17 請求：沿標頭長度定位 payload</text><rect x="40" y="78" width="820" height="66" rx="10" fill="#ffffff" stroke="#93a6bb"/><text x="60" y="103" font-size="20" font-weight="600">Ethernet：offset 0–13，14 bytes</text><text x="60" y="127" font-size="17">EtherType 0x0800 → IPv4；本例無 VLAN、無 FCS。</text><rect x="40" y="162" width="820" height="66" rx="10" fill="#ffffff" stroke="#93a6bb"/><text x="60" y="187" font-size="20" font-weight="600">IPv4：offset 14–33，20 bytes</text><text x="60" y="211" font-size="17">IP Total Length 53 = IP 20 + TCP 20 + payload 13。</text><rect x="40" y="246" width="820" height="66" rx="10" fill="#ffffff" stroke="#93a6bb"/><text x="60" y="271" font-size="20" font-weight="600">TCP：offset 34–53，20 bytes</text><text x="60" y="295" font-size="17">Data Offset 5 × 4 = 20；seq 1001，payload 長度 13。</text><rect x="40" y="330" width="820" height="66" rx="10" fill="#ffffff" stroke="#93a6bb"/><text x="60" y="355" font-size="20" font-weight="600">應用：offset 54–66，13 bytes</text><text x="60" y="379" font-size="17">00 0b（長度 11）+ REQ q17 GET（11 bytes）；下一期待 ACK 1014。</text><rect x="40" y="414" width="820" height="66" rx="10" fill="#ffffff" stroke="#93a6bb"/><text x="60" y="439" font-size="20" font-weight="600">若只保存 64 bytes</text><text x="60" y="463" font-size="17">payload 留 10，尾端缺 3；宣告長度不表示檔內資料完整。</text></g></svg>