<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" role="img" aria-label="抓包取得副本：每個觀察位置回答不同問題"><rect width="900" height="456" fill="#f3f6fa"/><g font-family="sans-serif" fill="#17283e"><text x="40" y="48" font-size="25" font-weight="700">抓包取得副本：每個觀察位置回答不同問題</text><rect x="40" y="78" width="820" height="66" rx="10" fill="#ffffff" stroke="#93a6bb"/><text x="60" y="103" font-size="20" font-weight="600">應用與 Socket</text><text x="60" y="127" font-size="17">SEND 日誌可能記在呼叫前或返回後；需確認語義。</text><rect x="40" y="162" width="820" height="66" rx="10" fill="#ffffff" stroke="#93a6bb"/><text x="60" y="187" font-size="20" font-weight="600">作業系統 → 介面 → 路徑 → 對端</text><text x="60" y="211" font-size="17">TCP 管理 bytes；實體、VPN、回環介面有不同可見範圍。</text><rect x="40" y="246" width="820" height="66" rx="10" fill="#ffffff" stroke="#93a6bb"/><text x="60" y="271" font-size="20" font-weight="600">擷取副本 → 擷取條件 → 有限緩衝 → 保存</text><text x="60" y="295" font-size="17">條件排除或緩衝溢位：整筆可能不入檔；snaplen：只留部分 bytes。</text><rect x="40" y="330" width="820" height="66" rx="10" fill="#ffffff" stroke="#93a6bb"/><text x="60" y="355" font-size="20" font-weight="600">Wireshark 解析 → 顯示篩選 → 列表／細節／bytes</text><text x="60" y="379" font-size="17">顯示篩選可以清除；不能恢復原本未保存的資料。</text></g></svg>