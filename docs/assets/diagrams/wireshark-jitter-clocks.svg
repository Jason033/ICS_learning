<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="RTP 媒體時鐘、到達時間與播放期限"><rect width="900" height="540" fill="#f3f6fa"/><g font-family="sans-serif" fill="#17283e"><text x="40" y="48" font-size="25" font-weight="700">RTP 媒體時鐘、到達時間與播放期限</text><rect x="40" y="78" width="820" height="66" rx="10" fill="#ffffff" stroke="#93a6bb"/><text x="60" y="103" font-size="20" font-weight="600">媒體生成順序</text><text x="60" y="127" font-size="17">307 → 308 → 309 → 310；8000 Hz 每 20 ms 通常前進 160。</text><rect x="40" y="162" width="820" height="66" rx="10" fill="#ffffff" stroke="#93a6bb"/><text x="60" y="187" font-size="20" font-weight="600">本套件入向到達順序</text><text x="60" y="211" font-size="17">307 (1.750) → 309 (1.790) → 308 (1.805) → 310 (1.810)。</text><rect x="40" y="246" width="820" height="66" rx="10" fill="#ffffff" stroke="#93a6bb"/><text x="60" y="271" font-size="20" font-weight="600">308 的播放期限若是 1.800 秒</text><text x="60" y="295" font-size="17">到達 1.805：晚 5 ms；最終收到仍可能被播放端捨棄。</text><rect x="40" y="330" width="820" height="66" rx="10" fill="#ffffff" stroke="#93a6bb"/><text x="60" y="355" font-size="20" font-weight="600">308 的播放期限改為 1.820 秒</text><text x="60" y="379" font-size="17">到達前 15 ms 可入緩衝；代價是更長等待，網路到達未改。</text><rect x="40" y="414" width="820" height="66" rx="10" fill="#ffffff" stroke="#93a6bb"/><text x="60" y="439" font-size="20" font-weight="600">RFC jitter：相對運輸時間的平滑變動</text><text x="60" y="463" font-size="17">D = 到達差 − 媒體差；J ← J + (|D| − J)/16，先統一時鐘單位。</text></g></svg>